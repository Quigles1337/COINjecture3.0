# The nightly toolchain, pinned by date, that runs the cargo-fuzz targets. Two jobs use
# it and no other does: the D6 `codec-fuzz-smoke` job (P-007 resume ruling, clause 4.5)
# and the D6 Nightly `full-fuzz-corpus` job (Gate G0-F ruling, clause 2.3). The
# workspace and every other job stay on the stable toolchain pinned in the repository
# root. `scripts/ci/codec-fuzz-common.ps1` reads the channel from this file.
[toolchain]
channel = "nightly-2026-11-15"
profile = "minimal"
