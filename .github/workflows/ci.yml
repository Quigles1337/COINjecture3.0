name: D6 CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: d6-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  format:
    name: format
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Select pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: clippy
    needs: format
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Select pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Deny lint warnings
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  dependency-policy:
    name: dependency-policy
    needs: clippy
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Select pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Restore pinned cargo-deny binary
        id: cache-cargo-deny
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-deny
          key: ${{ runner.os }}-cargo-deny-0.20.2-rust-1.97.1
      - name: Install cargo-deny
        if: steps.cache-cargo-deny.outputs.cache-hit != 'true'
        run: cargo install cargo-deny --version 0.20.2 --locked
      - name: Check dependency policy
        run: cargo deny --locked --all-features check
      # The fuzz harness is its own workspace under fuzz/, outside the graph the node is
      # built from. It has a policy of its own: the root policy plus one licence term,
      # NCSA, for libfuzzer-sys alone (Gate G0-F ruling, clause 4.5b). The first step
      # fails if fuzz/deny.toml differs from deny.toml in anything but that exception.
      - name: Check that the fuzz policy is the root policy plus one exception
        shell: pwsh
        run: ./scripts/ci/check-fuzz-deny-policy.ps1
      - name: Check the fuzz workspace's dependency policy
        run: cargo deny --manifest-path fuzz/Cargo.toml --config fuzz/deny.toml --locked --all-features check

  dependency-audit:
    name: dependency-audit
    needs: dependency-policy
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Select pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Restore pinned cargo-audit binary
        id: cache-cargo-audit
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-audit
          key: ${{ runner.os }}-cargo-audit-0.22.2-rust-1.97.1
      - name: Install cargo-audit
        if: steps.cache-cargo-audit.outputs.cache-hit != 'true'
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Audit the committed lockfile
        run: cargo audit --deny warnings
      # The fuzz harness is its own workspace under fuzz/, with a lockfile of its own.
      # It is audited here so that no lockfile in the repository goes unaudited.
      - name: Audit the committed fuzz lockfile
        run: cargo audit --deny warnings --file fuzz/Cargo.lock

  unsafe-audit:
    name: unsafe-audit
    needs: dependency-audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Select pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Restore pinned cargo-geiger binary
        id: cache-cargo-geiger
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-geiger
          key: ${{ runner.os }}-cargo-geiger-0.13.0-rust-1.97.1
      - name: Install cargo-geiger
        if: steps.cache-cargo-geiger.outputs.cache-hit != 'true'
        run: cargo install cargo-geiger --version 0.13.0 --locked
      - name: Enforce zero-unsafe policy
        shell: pwsh
        run: ./scripts/ci/verify-geiger.ps1

  unit-and-property-tests:
    name: unit-and-property-tests
    needs: unsafe-audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Select pinned Rust toolchain
        run: rustup show active-toolchain
      # Ruling G0-C8a to c: every P-007 vector is derived twice. This step is the
      # derivation that uses only the Python standard library; it fails if any
      # committed vector file differs from what it derives. The Rust tests below read
      # the same files and derive them again with the Rust code.
      - name: Re-derive the P-007 vectors with the standard-library script
        run: python3 -I -B bench/p007-vectors/derive.py --check
      # One arithmetic back end (Gate G0-F ruling, clause 4.5c). .cargo/config.toml
      # makes every build in this workflow use curve25519-dalek's serial back end, the
      # tests below included. This step builds cj3-types that way, then with the setting
      # absent, wrong and doubled, and requires each of those builds to fail to compile.
      - name: Prove that cj3-types compiles with the serial back end and no other
        shell: pwsh
        run: ./scripts/ci/check-arithmetic-backend.ps1
      - name: Run admitted tests
        run: cargo test --workspace --all-targets --all-features --locked

  conservation-invariant:
    name: conservation-invariant
    needs: unit-and-property-tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run or explicitly defer gate
        shell: pwsh
        run: ./scripts/ci/check-phase-gate.ps1 -Gate conservation-invariant

  lean-conformance:
    name: lean-conformance
    needs: unit-and-property-tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Lean toolchain for P-005 ratified spec
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9 # v1, resolved 2026-08-16
        with:
          auto-config: 'false'
          build: 'false'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'false'
          use-github-cache: 'false'
          lake-package-directory: spec
      - name: Run or explicitly defer gate
        shell: pwsh
        run: ./scripts/ci/check-phase-gate.ps1 -Gate lean-conformance

  codec-fuzz-smoke:
    name: codec-fuzz-smoke
    needs: unit-and-property-tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Select pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Restore pinned cargo-fuzz binary
        id: cache-cargo-fuzz
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-fuzz
          key: ${{ runner.os }}-cargo-fuzz-0.13.2-rust-1.97.1
      - name: Install cargo-fuzz
        if: steps.cache-cargo-fuzz.outputs.cache-hit != 'true'
        run: cargo install cargo-fuzz --version 0.13.2 --locked
      # In D6 this job alone uses a nightly toolchain, pinned by date in
      # fuzz/rust-toolchain.toml (P-007 resume ruling, clause 4.5). The D6 Nightly
      # full-fuzz-corpus job uses the same one (Gate G0-F ruling, clause 2.3). The
      # workspace and every other job stay on the stable toolchain pinned in
      # rust-toolchain.toml.
      - name: Install the date-pinned nightly toolchain for the fuzz targets
        run: |
          channel="$(sed -n 's/^channel = "\(nightly-[0-9-]*\)"$/\1/p' fuzz/rust-toolchain.toml)"
          test -n "$channel"
          rustup toolchain install "$channel" --profile minimal --no-self-update
      - name: Run or explicitly defer gate
        shell: pwsh
        run: ./scripts/ci/check-phase-gate.ps1 -Gate codec-fuzz-smoke

  genesis-spend-test:
    name: genesis-spend-test
    needs: unit-and-property-tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run or explicitly defer gate
        shell: pwsh
        run: ./scripts/ci/check-phase-gate.ps1 -Gate genesis-spend-test

  locked-build:
    name: locked-build
    needs:
      - conservation-invariant
      - lean-conformance
      - codec-fuzz-smoke
      - genesis-spend-test
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Select pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Build from the committed lockfile
        run: cargo build --workspace --all-targets --all-features --locked
