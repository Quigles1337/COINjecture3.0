name: D6 CI

on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: d6-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  format:
    name: format
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Select pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: clippy
    needs: format
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Select pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Deny lint warnings
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  dependency-policy:
    name: dependency-policy
    needs: clippy
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Select pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Install cargo-deny
        run: cargo install cargo-deny --version 0.20.2 --locked
      - name: Check dependency policy
        run: cargo deny --locked --all-features check

  dependency-audit:
    name: dependency-audit
    needs: dependency-policy
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Select pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Audit the committed lockfile
        run: cargo audit --deny warnings

  unsafe-audit:
    name: unsafe-audit
    needs: dependency-audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Select pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Install cargo-geiger
        run: cargo install cargo-geiger --version 0.13.0 --locked
      - name: Enforce zero-unsafe policy
        shell: pwsh
        run: ./scripts/ci/verify-geiger.ps1

  unit-and-property-tests:
    name: unit-and-property-tests
    needs: unsafe-audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Select pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Run admitted tests
        run: cargo test --workspace --all-targets --all-features --locked

  conservation-invariant:
    name: conservation-invariant
    needs: unit-and-property-tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run or explicitly defer gate
        shell: pwsh
        run: ./scripts/ci/check-phase-gate.ps1 -Gate conservation-invariant

  lean-conformance:
    name: lean-conformance
    needs: unit-and-property-tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run or explicitly defer gate
        shell: pwsh
        run: ./scripts/ci/check-phase-gate.ps1 -Gate lean-conformance

  codec-fuzz-smoke:
    name: codec-fuzz-smoke
    needs: unit-and-property-tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run or explicitly defer gate
        shell: pwsh
        run: ./scripts/ci/check-phase-gate.ps1 -Gate codec-fuzz-smoke

  genesis-spend-test:
    name: genesis-spend-test
    needs: unit-and-property-tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run or explicitly defer gate
        shell: pwsh
        run: ./scripts/ci/check-phase-gate.ps1 -Gate genesis-spend-test

  locked-build:
    name: locked-build
    needs:
      - conservation-invariant
      - lean-conformance
      - codec-fuzz-smoke
      - genesis-spend-test
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Select pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Build from the committed lockfile
        run: cargo build --workspace --all-targets --all-features --locked
