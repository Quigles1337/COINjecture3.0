name: D6 Nightly

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  dependency-drift:
    name: dependency-drift
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Select pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Report lockfile drift without writing it
        run: cargo update --dry-run --verbose
      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Audit current lockfile
        run: cargo audit --deny warnings

  full-fuzz-corpus:
    name: full-fuzz-corpus
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run or explicitly defer gate
        shell: pwsh
        run: ./scripts/ci/check-phase-gate.ps1 -Gate codec-fuzz-smoke
