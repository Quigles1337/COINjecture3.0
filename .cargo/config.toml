# One arithmetic back end, at one word size (Gate G0-F ruling, clause 4.5c; ruling
# "P-101 TO ITS FRAME", clauses 2.2 and 4.3a).
#
# Every build of cj3-types in this repository uses curve25519-dalek's serial back end.
# The library chooses its back end from the first configuration value set below. Without
# it, on x86_64, it chooses a back end that picks vector code by the processor's features
# at run time.
#
# The serial back end is two bodies of code, one written for 64-bit words and one for
# 32-bit words. The library chooses between them from the second value set below. Without
# it, it chooses by the target's pointer width. Every build of cj3-types in this
# repository sets it to exactly 64.
#
# Both values are pinned so that every node runs the same arithmetic whatever its
# processor. That is not a claim that no unsafe code remains on the path.
#
# cargo reads this file for every build started inside the repository. A RUSTFLAGS
# environment variable replaces these flags; it does not add to them. A build that sets
# RUSTFLAGS must therefore repeat both flags, as the fuzz gates do, because cargo-fuzz
# sets RUSTFLAGS (scripts/ci/codec-fuzz-common.ps1).
#
# cj3-types refuses to compile unless the first value is exactly `serial` and the second
# is exactly `64` (crates/cj3-types/build.rs and crates/cj3-types/src/lib.rs). A build
# that loses either flag fails. It never falls back to another choice silently.
[build]
rustflags = ["--cfg", "curve25519_dalek_backend=\"serial\"", "--cfg", "curve25519_dalek_bits=\"64\""]
rustdocflags = ["--cfg", "curve25519_dalek_backend=\"serial\"", "--cfg", "curve25519_dalek_bits=\"64\""]
